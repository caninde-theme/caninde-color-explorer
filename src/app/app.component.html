<app-navbar />

<main class="explorer">
  @if (loading) {
    <p class="status-message">Carregando imagem e regiões…</p>
  }

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  @if (!loading && !error) {
    <section id="explorer" class="image-container">
      <button
        type="button"
        class="exploration-toggle"
        [class.exploration-toggle--active]="explorationMode"
        [attr.aria-pressed]="explorationMode"
        (click)="toggleExplorationMode()"
      >
        @if (explorationMode) {
          <span>✓ Concluir exploração</span>
        } @else {
          <span>⌖ Explorar cores</span>
        }
      </button>

      <div
        #stageHost
        class="stage-host"
        [class.exploration-mode]="explorationMode"
      ></div>

      @if (activeShape && activeDetails) {
        <app-color-tooltip
          [content]="activeDetails"
          [pinned]="pinnedId !== null"
          [left]="tooltipPosition.left"
          [top]="tooltipPosition.top"
          (close)="closeModal()"
        />
      }
    </section>
    <footer id="photo-credit" class="photo-credit">
      Foto de
      <a
        href="https://unsplash.com/pt-br/@davidclode?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        target="_blank"
        rel="noopener noreferrer"
      >
        David Clode
      </a>
      na
      <a
        href="https://unsplash.com/pt-br/fotografias/um-par-de-passaros-coloridos-Mkv2aKWHx00?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        target="_blank"
        rel="noopener noreferrer"
      >
        Unsplash </a
      >.
    </footer>
  }
</main>

<div class="orientation-prompt" aria-live="polite">
  <div class="orientation-prompt__content">
    <div class="orientation-prompt__icon" aria-hidden="true">
      <span>↻</span>
    </div>

    <h2>Gire seu dispositivo</h2>

    <p>
      Para explorar melhor os detalhes da imagem, utilize o aparelho na
      horizontal.
    </p>
  </div>
</div>
