<app-navbar />

<main class="explorer">
  @if (loading) {
    <p class="status-message">Loading image and regions...</p>
  }

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  @if (!loading && !error) {
    <section id="explorer" class="image-container">
      <button
        type="button"
        class="exploration-toggle"
        [class.exploration-toggle--active]="explorationMode"
        [attr.aria-pressed]="explorationMode"
        (click)="toggleExplorationMode()"
      >
        @if (explorationMode) {
          <span>✓ Finish exploring</span>
        } @else {
          <span>⌖ Explore colors</span>
        }
      </button>

      <div
        #stageHost
        class="stage-host"
        [class.exploration-mode]="explorationMode"
      ></div>

      @if (activeShape && activeDetails) {
        <app-color-tooltip
          [content]="activeDetails"
          [pinned]="pinnedId !== null"
          [left]="tooltipPosition.left"
          [top]="tooltipPosition.top"
          (close)="closeModal()"
        />
      }
    </section>
  }

  <app-about id="about" />

  <app-contribute id="contribute" />
</main>

<app-footer />

<div class="orientation-prompt" aria-live="polite">
  <div class="orientation-prompt__content">
    <div class="orientation-prompt__icon" aria-hidden="true">
      <span>↻</span>
    </div>

    <h2>Rotate your device</h2>

    <p>
      To explore the image details better, use your device in landscape
      orientation.
    </p>
  </div>
</div>
