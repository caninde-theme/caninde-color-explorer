<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canindé Theme — Open-source colors for every platform</title>

    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Discover Canindé, an open-source color theme built to grow across platforms. Explore its colors, help shape its design system, and contribute to its evolution."
    />

    <meta name="author" content="Canindé Theme contributors" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#053001" />

    <link rel="canonical" href="https://caninde.duar.ch/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canindé Theme" />
    <meta
      property="og:title"
      content="Canindé Theme — Open-source colors for every platform"
    />
    <meta
      property="og:description"
      content="A growing open-source color theme. Explore the palette, contribute to the project, and help bring Canindé to more platforms."
    />
    <meta property="og:url" content="https://caninde.duar.ch/" />
    <meta property="og:image" content="https://caninde.duar.ch/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Canindé Theme — an open-source color theme inspired by nature"
    />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Canindé Theme — Open-source colors for every platform"
    />
    <meta
      name="twitter:description"
      content="Explore an open-source color theme and help bring Canindé to more platforms."
    />
    <meta name="twitter:image" content="https://caninde.duar.ch/og-image.png" />

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
